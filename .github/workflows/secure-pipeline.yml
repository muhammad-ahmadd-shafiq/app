# SecureGitOps pipeline (Phase 3: hybrid scoring gate).
#
# Hybrid behaviour:
#   - scan jobs (gitleaks, semgrep, trivy-fs) use continue-on-error, so they
#     report their findings to the dashboard but never stop the run themselves
#   - the image scan and signing steps in the build job also report only
#   - the score job reads everything from the dashboard, applies the hybrid
#     policy (hard blockers always fail, the rest is scored) and is the only gate
#   - update-gitops depends on the score job, so a failed verdict blocks deploy
#     when ENFORCE is true
#
# ADJUST markers show what to compare with your working baseline.yml:
#   1. test job commands
#   2. docker build contexts
#   3. how you log in to GHCR
#   4. the kustomize image names and path in the update-gitops job
name: secure-pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      gates_enforce:
        description: "true = a failed score verdict stops the deploy, false = gates only report"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

env:
  ENFORCE: ${{ inputs.gates_enforce || 'true' }}
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
  IMAGE_OWNER: muhammad-ahmadd-shafiq
  GITOPS_REPO: muhammad-ahmadd-shafiq/gitops-config

jobs:
  # ---------------------------------------------------------------- tests
  test:
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run tests
        run: |
          # ADJUST: copy your real test commands from baseline.yml
          if [ -f services/api/requirements.txt ]; then
            python3 -m venv .venv && . .venv/bin/activate
            pip install -q -r services/api/requirements.txt pytest
          fi
          if [ -d services/api/tests ]; then pytest -q services/api/tests; else echo "No tests found, skipping"; fi
      - name: Report
        if: always()
        env:
          STAGE: test
          TOOL: pytest
          STATUS: ${{ job.status == 'success' && 'pass' || 'fail' }}
          REPORT_ONLY: "true"
        run: bash .github/scripts/report.sh

  # ---------------------------------------------------------------- scans (run in parallel, report only)
  gitleaks:
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - run: bash .github/scripts/scan-gitleaks.sh

  semgrep:
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: bash .github/scripts/scan-semgrep.sh

  trivy-fs:
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: bash .github/scripts/trivy.sh fs . trivy-fs

  sbom-source:
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: bash .github/scripts/sbom.sh dir:. sbom-source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-source
          path: sbom-source.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- build, scan image, push, sign
  build:
    needs: [test, gitleaks, semgrep, trivy-fs, sbom-source]
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ADJUST if your baseline uses a PAT secret
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build images
        run: |
          for svc in api frontend; do   # ADJUST build contexts
            docker build -t "ghcr.io/${IMAGE_OWNER}/target-${svc}:${GITHUB_SHA}" "./services/${svc}"
          done

      # Stage names start with "trivy" so the scoring policy matches them.
      - name: Scan images with Trivy (report only, the score job decides)
        run: |
          for svc in api frontend; do
            bash .github/scripts/trivy.sh image "ghcr.io/${IMAGE_OWNER}/target-${svc}:${GITHUB_SHA}" "trivy-image-${svc}" \
              || echo "trivy-image-${svc} reported findings"
          done

      - name: Push images
        run: |
          for svc in api frontend; do
            docker push "ghcr.io/${IMAGE_OWNER}/target-${svc}:${GITHUB_SHA}"
          done

      - name: Sign images with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          START=$(date +%s)
          rc=0
          for svc in api frontend; do
            REF=$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/${IMAGE_OWNER}/target-${svc}:${GITHUB_SHA}")
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$REF" || rc=1
          done
          if [ $rc -eq 0 ]; then S=pass; else S=fail; fi
          STAGE=sign TOOL=cosign STATUS=$S REPORT_ONLY=true DURATION=$(( $(date +%s) - START )) bash .github/scripts/report.sh

      - name: SBOM of images
        run: |
          for svc in api frontend; do
            bash .github/scripts/sbom.sh "docker:ghcr.io/${IMAGE_OWNER}/target-${svc}:${GITHUB_SHA}" "sbom-image-${svc}"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-images
          path: sbom-image-*.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- score gate (hybrid)
  score:
    needs: [gitleaks, semgrep, trivy-fs, build]
    if: ${{ always() }}
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    outputs:
      verdict: ${{ steps.s.outputs.verdict }}
    steps:
      - id: s
        run: |
          RESULT=$(curl -sf -X POST \
            "${DASHBOARD_URL}/api/builds/run/${GITHUB_RUN_ID}/score" \
            -H "X-API-Key: ${DASHBOARD_API_KEY}")
          echo "$RESULT"
          VERDICT=$(echo "$RESULT" | jq -r .verdict)
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" = "fail" ] && [ "$ENFORCE" = "true" ]; then
            echo "Build blocked by score gate"
            exit 1
          fi

  # ---------------------------------------------------------------- deploy (main branch only)
  update-gitops:
    needs: [build, score]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Update image tags in gitops-config
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # ADJUST: if your baseline update-gitops job works, keep yours and only keep the needs line above
          KEY=$(mktemp); printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$KEY"; chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          rm -rf gitops-config
          git clone "git@github.com:${GITOPS_REPO}.git" gitops-config
          cd gitops-config/apps/target-app
          for svc in api frontend; do
            kustomize edit set image "ghcr.io/${IMAGE_OWNER}/target-${svc}=ghcr.io/${IMAGE_OWNER}/target-${svc}:${GITHUB_SHA}"
          done
          cd ../..
          git config user.name "secure-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7} from app repo" || echo "No changes to commit"
          git push origin HEAD:main
          rm -f "$KEY"
      - name: Report
        if: always()
        env:
          STAGE: update-gitops
          TOOL: kustomize
          STATUS: ${{ job.status == 'success' && 'pass' || 'fail' }}
          REPORT_ONLY: "true"
        run: bash .github/scripts/report.sh

  # ---------------------------------------------------------------- overall result
  finalize:
    if: always()
    needs: [test, gitleaks, semgrep, trivy-fs, sbom-source, build, score, update-gitops]
    runs-on: [self-hosted, lab]
    env:
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Report pipeline result
        env:
          STAGE: pipeline
          TOOL: github-actions
          STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.score.outputs.verdict == 'fail') && 'fail' || 'pass' }}
          REPORT_ONLY: "true"
        run: bash .github/scripts/report.sh