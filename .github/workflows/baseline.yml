name: baseline
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OWNER: muhammad-ahmadd-shafiq

jobs:
  test:
    runs-on: [self-hosted, lab]
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        working-directory: services/${{ matrix.service }}
        run: |
          python3 -m venv /tmp/venv-${{ matrix.service }}
          . /tmp/venv-${{ matrix.service }}/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

  build:
    needs: test
    runs-on: [self-hosted, lab]
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.OWNER }}/target-${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    needs: build
    runs-on: [self-hosted, lab]
    concurrency: gitops-update
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muhammad-ahmadd-shafiq/gitops-config
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
      - name: Set new image tags
        working-directory: gitops/apps/target-app
        run: |
          kustomize edit set image \
            ghcr.io/${{ env.OWNER }}/target-api=ghcr.io/${{ env.OWNER }}/target-api:${{ github.sha }} \
            ghcr.io/${{ env.OWNER }}/target-frontend=ghcr.io/${{ env.OWNER }}/target-frontend:${{ github.sha }}
      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${{ github.sha }}"
          git pull --rebase
          git push