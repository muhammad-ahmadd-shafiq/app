<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <style>
    :root { --ink:#1d2433; --muted:#6b7385; --line:#dfe3ea; --accent:#0f766e; --bg:#f6f7f9; --err:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
    form.add { display:flex; gap:.5rem; margin-bottom:1rem; }
    input[type=text] { flex:1; padding:.6rem .75rem; border:1px solid var(--line); border-radius:6px; font-size:1rem; }
    button { padding:.55rem .9rem; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:.95rem; cursor:pointer; }
    button.ghost { background:transparent; color:var(--muted); padding:.3rem .5rem; }
    ul { list-style:none; margin:0; padding:0; background:#fff; border:1px solid var(--line); border-radius:8px; }
    li { display:flex; align-items:center; gap:.5rem; padding:.7rem .9rem; border-bottom:1px solid var(--line); }
    li:last-child { border-bottom:0; }
    li .title { flex:1; }
    li.done .title { text-decoration: line-through; color:var(--muted); }
    .error { background:#fef3f2; color:var(--err); border:1px solid #fecdca; padding:.6rem .8rem; border-radius:6px; margin-bottom:1rem; }
    .empty { color:var(--muted); padding:1rem; text-align:center; }
  </style>
</head>
<body>
<main>
  <h1>Task Board</h1>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form class="add" method="post" action="{{ url_for('add') }}">
    <input type="text" name="title" placeholder="Add a task" maxlength="200" required>
    <button type="submit">Add</button>
  </form>
  {% if tasks %}
  <ul>
    {% for task in tasks %}
    <li class="{{ 'done' if task.done else '' }}">
      <form method="post" action="{{ url_for('toggle', task_id=task.id) }}">
        <input type="hidden" name="done" value="{{ 'false' if task.done else 'true' }}">
        <button class="ghost" type="submit">{{ 'Undo' if task.done else 'Done' }}</button>
      </form>
      <span class="title">{{ task.title }}</span>
      <form method="post" action="{{ url_for('delete', task_id=task.id) }}">
        <button class="ghost" type="submit">Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">No tasks yet.</p>
  {% endif %}
</main>
</body>
</html>
